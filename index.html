<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
<title>PetCare HQ</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0f172a;
    --navy-soft:#334155;
    --blue:#2563eb;
    --blue-dark:#1d4ed8;
    --blue-tint:#eff6ff;
    --bg:#f8fafc;
    --card:#ffffff;
    --border:#e6eaf0;
    --success:#16a34a;
    --success-tint:#f0fdf4;
    --danger:#dc2626;
    --danger-tint:#fef2f2;
    --amber:#d97706;
    --amber-tint:#fffbeb;
  }
  *{font-family:'Plus Jakarta Sans',system-ui,sans-serif;}
  body{background:var(--bg); -webkit-tap-highlight-color:transparent;}
  ::-webkit-scrollbar{width:0;height:0;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:16px;}
  .btn-primary{background:var(--blue); color:#fff; border-radius:12px; font-weight:600; transition:.15s;}
  .btn-primary:active{background:var(--blue-dark); transform:scale(.98);}
  .btn-ghost{background:#fff; color:var(--navy); border:1px solid var(--border); border-radius:12px; font-weight:600;}
  .input-field{background:#fff; border:1px solid var(--border); border-radius:12px; padding:10px 14px; width:100%; font-size:14px; color:var(--navy); outline:none;}
  .input-field:focus{border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-tint);}
  .label-sm{font-size:12px; font-weight:600; color:var(--navy-soft); margin-bottom:6px; display:block;}
  .nav-item{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; flex:1; padding:8px 0 6px; color:#94a3b8; transition:.2s;}
  .nav-item.active{color:var(--blue);}
  .nav-item svg{width:22px; height:22px;}
  .fade-in{animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  .spinner{width:36px; height:36px; border:3px solid var(--blue-tint); border-top-color:var(--blue); border-radius:50%; animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .chip{padding:6px 14px; border-radius:999px; font-size:13px; font-weight:600; border:1px solid var(--border); background:#fff; color:var(--navy-soft); white-space:nowrap;}
  .chip.active{background:var(--navy); color:#fff; border-color:var(--navy);}
  .modal-backdrop{background:rgba(15,23,42,.5); backdrop-filter:blur(2px);}
  .modal-sheet{border-radius:20px 20px 0 0; max-height:88vh;}
  .toast{border-radius:12px; box-shadow:0 10px 30px rgba(15,23,42,.18);}
  .fab{box-shadow:0 8px 20px rgba(37,99,235,.35);}
  .avatar-ring{padding:2px; border-radius:999px; background:linear-gradient(135deg,var(--blue),#60a5fa);}
</style>
</head>
<body class="min-h-screen">

<!-- ============ HEADER ============ -->

<!-- ============ MODAL ROOT ============ -->
<div id="modalRoot"></div>

<script>
/* =========================================================================
   ⚙️ CONFIG — Google Apps Script Web App URL'i
   Kod içine elle yazmana gerek yok: uygulama açıldığında "Kurulum gerekiyor"
   ekranından ya da sağ üstteki ⚙️ ayarlar butonundan girip kaydedebilirsin.
   Kaydedilen URL tarayıcının localStorage'ında saklanır (bu dosyayı bir
   sunucuda barındırdığında veya doğrudan tarayıcıda açtığında kalıcıdır;
   Claude'un artifact önizlemesi içinde localStorage çalışmayabilir — o
   durumda dosyayı indirip kendi tarayıcında açman gerekir).
   ========================================================================= */
const STORAGE_KEY = 'petcarehq_api_url';
const CONFIG = {
  API_URL: ""
};
function loadStoredApiUrl(){
  try { return localStorage.getItem(STORAGE_KEY) || ''; } catch(e){ return ''; }
}
function saveStoredApiUrl(url){
  try { localStorage.setItem(STORAGE_KEY, url); return true; } catch(e){ return false; }
}
CONFIG.API_URL = loadStoredApiUrl();

/* =========================================================================
   STATE
   ========================================================================= */
const state = {
  pets: [],
  activePetId: null,
  data: { Vaccines: [], Medications: [], Boarding: [], Expenses: [], NutritionLog: [] },
  settings: { id: null, reminderEmail: '' },
  activeTab: 'dashboard',
  medicalSubTab: 'vaccines',
  nutritionFilter: 'all'
};

const SPECIES_META = {
  'Köpek': { icon: '🐶' },
  'Kedi': { icon: '🐱' },
  'Diğer': { icon: '🐾' }
};

const CURRENCIES = [
  { code: 'TRY', label: 'TL (₺)' },
  { code: 'USD', label: 'Dolar ($)' },
  { code: 'EUR', label: 'Euro (€)' },
  { code: 'GBP', label: 'Sterlin (£)' },
  { code: 'CHF', label: 'İsviçre Frangı' }
];
const DEFAULT_CURRENCY = 'TRY';
function currencyOptionsHtml(selected){
  return CURRENCIES.map(c=>`<option value="${c.code}" ${selected===c.code?'selected':''}>${c.label}</option>`).join('');
}

/* =========================================================================
   API HELPERS
   ========================================================================= */
function isConfigured(){
  return CONFIG.API_URL && CONFIG.API_URL.indexOf('http') === 0;
}

async function apiListAll(){
  const res = await fetch(`${CONFIG.API_URL}?action=listAll`);
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'Bilinmeyen hata');
  return json.data;
}

async function apiCreate(sheet, data){
  return apiMutate('create', sheet, null, data);
}
async function apiUpdate(sheet, id, data){
  return apiMutate('update', sheet, id, data);
}
async function apiDelete(sheet, id){
  return apiMutate('delete', sheet, id, {});
}
async function apiMutate(action, sheet, id, data){
  const res = await fetch(CONFIG.API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // preflight'tan kaçınmak için text/plain
    body: JSON.stringify({ action, sheet, id, data })
  });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'İşlem başarısız');
  return json.data;
}

/** Sheet gerektirmeyen özel action'lar için (test e-postası, hatırlatma kontrolü vb.) */
async function apiAction(action, data){
  const res = await fetch(CONFIG.API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, data })
  });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || 'İşlem başarısız');
  return json.data;
}

/** Tüm hatırlatma e-postaları için kullanılan tek/ortak adresi kaydeder (Pet formlarından çağrılır). */
async function saveReminderEmailIfChanged(email){
  const trimmed = (email || '').trim();
  if (trimmed === (state.settings.reminderEmail || '')) return; // değişmemişse hiç istek atma
  try{
    if (state.settings.id){
      state.settings = await apiUpdate('Settings', state.settings.id, { reminderEmail: trimmed });
    } else {
      state.settings = await apiCreate('Settings', { reminderEmail: trimmed });
    }
  } catch(err){
    showToast('Hatırlatma e-postası kaydedilemedi: ' + err.message, 'error');
  }
}

/* =========================================================================
   UI HELPERS — loading / toast / modal
   ========================================================================= */
function setLoading(on){
  document.getElementById('loadingOverlay').style.display = on ? 'flex' : 'none';
}

function showToast(message, type='success'){
  const colors = {
    success: { bg: 'var(--success-tint)', fg: 'var(--success)', icon: '✓' },
    error: { bg: 'var(--danger-tint)', fg: 'var(--danger)', icon: '✕' },
    info: { bg: 'var(--blue-tint)', fg: 'var(--blue)', icon: 'i' }
  };
  const c = colors[type] || colors.info;
  const el = document.createElement('div');
  el.className = 'toast fade-in flex items-center gap-2 px-4 py-3 text-sm font-semibold max-w-sm w-full';
  el.style.background = '#fff';
  el.style.border = `1px solid ${c.fg}22`;
  el.innerHTML = `<span class="w-5 h-5 rounded-full flex items-center justify-center text-[11px]" style="background:${c.bg};color:${c.fg};">${c.icon}</span><span style="color:var(--navy);">${message}</span>`;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='.3s'; setTimeout(()=>el.remove(),300); }, 2600);
}

function openModal(innerHtml){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="fixed inset-0 z-50 flex items-end justify-center modal-backdrop" id="modalBackdrop">
      <div class="modal-sheet bg-white w-full max-w-md overflow-y-auto fade-in" id="modalSheet">
        ${innerHtml}
      </div>
    </div>`;
  document.getElementById('modalBackdrop').addEventListener('click', (e)=>{
    if (e.target.id === 'modalBackdrop') closeModal();
  });
}
function closeModal(){
  document.getElementById('modalRoot').innerHTML = '';
}

function fmtDate(d){
  if (!d) return '—';
  const date = new Date(d);
  if (isNaN(date)) return d;
  return date.toLocaleDateString('tr-TR', { day:'2-digit', month:'short', year:'numeric' });
}
function fmtMoney(n, currency){
  const v = Number(n)||0;
  const code = currency || DEFAULT_CURRENCY;
  try{
    return new Intl.NumberFormat('tr-TR', { style:'currency', currency: code }).format(v);
  } catch(e){
    return v.toLocaleString('tr-TR', { minimumFractionDigits:2, maximumFractionDigits:2 }) + ' ' + code;
  }
}
/** Farklı para birimlerindeki tutarları tek satırda özetler: "120,00 € · 45,00 $" gibi. */
function fmtGroupedTotals(records, amountField, currencyField='currency'){
  const totals = {};
  records.forEach(r=>{
    const code = r[currencyField] || DEFAULT_CURRENCY;
    totals[code] = (totals[code]||0) + (Number(r[amountField])||0);
  });
  const codes = Object.keys(totals);
  if (!codes.length) return fmtMoney(0);
  return codes.map(code=> fmtMoney(totals[code], code)).join(' · ');
}
function daysUntil(d){
  if (!d) return null;
  const now = new Date(); now.setHours(0,0,0,0);
  const target = new Date(d); target.setHours(0,0,0,0);
  return Math.round((target-now)/86400000);
}
function uid(){ return 'tmp_' + Math.random().toString(36).slice(2,9); }

/* =========================================================================
   IMAGE RESIZE (base64, Sheets hücresine sığması için küçültülür)
   ========================================================================= */
function resizeImageFile(file, maxSize=320){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const canvas = document.createElement('canvas');
        let { width, height } = img;
        if (width > height && width > maxSize){ height *= maxSize/width; width = maxSize; }
        else if (height > maxSize){ width *= maxSize/height; height = maxSize; }
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* =========================================================================
   VERİ ÇEKME
   ========================================================================= */
async function loadAll(){
  if (!isConfigured()){
    showToast('Lütfen önce CONFIG.API_URL alanını Apps Script Web App linkinle doldur.', 'error');
    renderTab();
    return;
  }
  setLoading(true);
  try {
    const all = await apiListAll();
    state.pets = all.Pets || [];
    state.data.Vaccines = all.Vaccines || [];
    state.data.Medications = all.Medications || [];
    state.data.Boarding = all.Boarding || [];
    state.data.Expenses = all.Expenses || [];
    state.data.NutritionLog = all.NutritionLog || [];
    const settingsRow = (all.Settings || []).find(s=>s.reminderEmail) || (all.Settings || [])[0];
    state.settings = settingsRow ? settingsRow : { id: null, reminderEmail: '' };
    if (!state.activePetId || !state.pets.find(p=>p.id===state.activePetId)){
      state.activePetId = state.pets[0] ? state.pets[0].id : null;
    }
    renderHeader();
    renderTab();
  } catch(err){
    showToast('Veri çekilemedi: ' + err.message, 'error');
  } finally {
    setLoading(false);
  }
}

function activePet(){ return state.pets.find(p=>p.id===state.activePetId) || null; }
function petRecords(sheet){ return state.data[sheet].filter(r=>String(r.petId)===String(state.activePetId)); }

/* =========================================================================
   HEADER — pet switcher
   ========================================================================= */
function renderHeader(){
  const pet = activePet();
  const photoEl = document.getElementById('headerPetPhoto');
  const initialEl = document.getElementById('headerPetInitial');
  const nameEl = document.getElementById('headerPetName');
  if (pet){
    nameEl.textContent = pet.name;
    if (pet.photoUrl){
      photoEl.src = pet.photoUrl; photoEl.style.display='block'; initialEl.style.display='none';
    } else {
      photoEl.style.display='none'; initialEl.style.display='flex';
      initialEl.textContent = pet.name ? pet.name[0].toUpperCase() : '?';
    }
  } else {
    nameEl.textContent = 'Pet ekle';
    photoEl.style.display='none'; initialEl.style.display='flex'; initialEl.textContent='+';
  }
}

document.getElementById('petSwitcher').addEventListener('click', openPetSwitcherModal);
document.getElementById('settingsBtn').addEventListener('click', openSettingsModal);

function openSettingsModal(){
  openModal(`
    <div class="p-5">
      <div class="w-10 h-1.5 rounded-full bg-slate-200 mx-auto mb-4"></div>
      <h3 class="font-extrabold text-lg mb-1" style="color:var(--navy);">Bağlantı Ayarları</h3>
      <p class="text-sm mb-4" style="color:var(--navy-soft);">Google Apps Script Web App linkini test edip kaydedebilirsin.</p>
      ${connectionSettingsFormHtml('settings')}

      <div class="pt-4 mt-4" style="border-top:1px dashed var(--border);">
        <h4 class="font-bold text-sm mb-1" style="color:var(--navy);">📧 Hatırlatma E-postaları</h4>
        <p class="text-xs mb-3" style="color:var(--navy-soft);">Şu an kayıtlı adres: <b>${state.settings.reminderEmail || 'yok — Pet Düzenle ekranından ekle'}</b></p>
        <div class="flex flex-col gap-2">
          <button type="button" id="testEmailBtn" class="btn-ghost w-full py-3 text-sm">✉️ Test E-postası Gönder</button>
          <button type="button" id="checkRemindersBtn" class="btn-ghost w-full py-3 text-sm">🔍 Hatırlatmaları Şimdi Kontrol Et</button>
        </div>
        <p class="text-[11px] mt-2" style="color:#94a3b8;">İkinci buton, 09:00'ı beklemeden bugün/yarına ait gerçek kayıtları tarar ve varsa e-posta gönderir — sistemin doğru çalıştığını hemen görebilirsin.</p>
      </div>

      <button type="button" onclick="closeModal()" class="btn-ghost w-full py-3 mt-4">Kapat</button>
    </div>
  `);
  bindConnectionSettingsForm('settings', ()=>{ closeModal(); loadAll(); });

  document.getElementById('testEmailBtn').addEventListener('click', async ()=>{
    setLoading(true);
    try{
      const data = await apiAction('sendTestEmail', {});
      showToast('Test e-postası gönderildi: ' + data.email, 'success');
    } catch(err){
      showToast('Gönderilemedi: ' + err.message, 'error');
    } finally { setLoading(false); }
  });

  document.getElementById('checkRemindersBtn').addEventListener('click', async ()=>{
    setLoading(true);
    try{
      const result = await apiAction('runReminderCheckNow', {});
      if (result.reason === 'no-email'){
        showToast('Önce Pet Düzenle ekranından bir hatırlatma e-postası kaydet.', 'error');
      } else if (result.sent){
        showToast(result.count + ' hatırlatma bulundu, e-posta gönderildi ✓', 'success');
      } else {

async function deletePetConfirm(petId){
  const pet = state.pets.find(p=>p.id===petId);
  if (!pet) return;
  const ok = confirm(`"${pet.name}" adlı peti ve buna bağlı TÜM sağlık, otel, finans ve beslenme kayıtlarını silmek istediğine emin misin? Bu işlem geri alınamaz.`);
  if (!ok) return;

  setLoading(true);
  try{
    // Bağlı kayıtları da temizle (aşı, ilaç, otel, harcama, beslenme günlüğü)
    const relatedSheets = ['Vaccines', 'Medications', 'Boarding', 'Expenses', 'NutritionLog'];
    for (const sheet of relatedSheets){
      const related = state.data[sheet].filter(r=>String(r.petId)===String(petId));
      for (const rec of related){
        await apiDelete(sheet, rec.id);
      }
      state.data[sheet] = state.data[sheet].filter(r=>String(r.petId)!==String(petId));
    }
    await apiDelete('Pets', petId);
    state.pets = state.pets.filter(p=>p.id!==petId);
    if (state.activePetId === petId){
      state.activePetId = state.pets[0] ? state.pets[0].id : null;
    }
    closeModal();
    renderHeader(); renderTab();
    showToast('Pet ve bağlı tüm kayıtlar silindi', 'info');
  } catch(err){
    showToast('Silinemedi: ' + err.message, 'error');
  } finally { setLoading(false); }
}

  switch(state.activeTab){
    case 'dashboard': content.innerHTML = renderDashboard(); afterDashboardRender(); break;

function connectionSettingsFormHtml(prefix){
  return `

    <label class="label-sm">Web App URL</label>
    <input id="${prefix}-urlInput" class="input-field mb-2" placeholder="https://script.google.com/macros/s/.../exec" value="${CONFIG.API_URL || ''}">
    <div id="${prefix}-status" class="text-xs mb-3" style="min-height:16px;"></div>
    <div class="flex gap-3">
      <button type="button" id="${prefix}-testBtn" class="btn-ghost flex-1 py-3">Test Et</button>
      <button type="button" id="${prefix}-saveBtn" class="btn-primary flex-1 py-3">Kaydet</button>
    </div>
  </div>`;

function bindConnectionSettingsForm(prefix, onSaved){
  const input = document.getElementById(`${prefix}-urlInput`);
  const status = document.getElementById(`${prefix}-status`);
  const testBtn = document.getElementById(`${prefix}-testBtn`);
  const saveBtn = document.getElementById(`${prefix}-saveBtn`);

  function setStatus(msg, ok){
    status.textContent = msg;
    status.style.color = ok ? 'var(--success)' : 'var(--danger)';
  }

  async function testUrl(url){
    const res = await fetch(`${url}?action=listAll`);
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'Sunucu bir hata döndürdü');
    return json;
  }

  testBtn.addEventListener('click', async ()=>{
    const url = input.value.trim();
    if (!url.startsWith('http')){ setStatus('Geçerli bir URL gir (https:// ile başlamalı).', false); return; }
    setStatus('Test ediliyor...', true);
    setLoading(true);
    try{
      await testUrl(url);
      setStatus('✓ Bağlantı başarılı! Kaydedebilirsin.', true);
    } catch(err){
      setStatus('✕ Bağlanamadı: ' + err.message, false);
    } finally { setLoading(false); }
  });

  saveBtn.addEventListener('click', async ()=>{
    const url = input.value.trim();
    if (!url.startsWith('http')){ setStatus('Geçerli bir URL gir (https:// ile başlamalı).', false); return; }
    setLoading(true);
    try{
      await testUrl(url); // kaydetmeden önce doğrula
      const persisted = saveStoredApiUrl(url);
      CONFIG.API_URL = url;
      setStatus(persisted ? '✓ Kaydedildi ve bağlanıldı.' : '✓ Bağlanıldı (bu oturum için; kalıcı kaydedilemedi).', true);
      showToast('Bağlantı ayarları kaydedildi ✓');
      if (onSaved) onSaved();
    } catch(err){
      setStatus('✕ Kaydedilemedi, önce bağlantıyı test et: ' + err.message, false);
    } finally { setLoading(false); }
  });
}

/* =========================================================================
   ORTAK: form submit / silme / arama
   ========================================================================= */
function submitRecordForm(e, sheet){
  e.preventDefault();
  const fd = new FormData(e.target);
  const payload = Object.fromEntries(fd.entries());
  saveRecord(sheet, payload);
}
async function saveRecord(sheet, payload){
  payload.petId = state.activePetId;
  setLoading(true);
  try{
    const created = await apiCreate(sheet, payload);
    state.data[sheet].push(created);
    closeModal();
    renderTab();
    showToast('Kayıt eklendi ✓');
  } catch(err){
    showToast('Kaydedilemedi: ' + err.message, 'error');
  } finally { setLoading(false); }
}
function bindDeleteButtons(){
  document.querySelectorAll('.delBtn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const { sheet, id } = btn.dataset;
      if (!confirm('Bu kaydı silmek istediğine emin misin?')) return;
      setLoading(true);
      try{
        await apiDelete(sheet, id);
        state.data[sheet] = state.data[sheet].filter(r=>r.id!==id);
        renderTab();
        showToast('Kayıt silindi', 'info');
      } catch(err){
        showToast('Silinemedi: ' + err.message, 'error');
      } finally { setLoading(false); }
    });
  });
}
function bindSearch(inputId, cardSelector, textSelectors){
  const input = document.getElementById(inputId);
  if (!input) return;
  input.addEventListener('input', ()=>{
    const q = input.value.trim().toLowerCase();
    document.querySelectorAll(cardSelector).forEach(card=>{
      const text = card.textContent.toLowerCase();
      card.style.display = text.includes(q) ? '' : 'none';
    });
  });
}

/* =========================================================================
   INIT
   ========================================================================= */
loadAll();
</script>
